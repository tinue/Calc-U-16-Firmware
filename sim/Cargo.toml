[package]
name = "voyager-sim"
version = "0.1.0"
edition = "2021"
description = "Hardware simulator for the SwissMicros Voyager (DM-L) calculators: runs the vendor firmware on an LPC111x board model"

[lib]
name = "voyager"
path = "src/lib.rs"

[[bin]]
name = "voyager-sim"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[profile.release]
debug = 1
lto = "thin"

[profile.dev]
opt-level = 2
